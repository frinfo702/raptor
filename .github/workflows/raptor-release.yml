# Fork-only: attach a self-signed (or, without the signing secrets,
# ad-hoc-signed) Raptor DMG to each GitHub release, plus standalone rap
# tarballs and their curl installer.
# Free (no Apple Developer Program), so the app is not notarized and the
# release notes tell users how to open it.
name: Raptor Release DMG
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Raptor release tag to rebuild the DMG for, e.g. raptor-v0.1.2
        required: true
        type: string

permissions:
  contents: write

jobs:
  dmg:
    # Apple silicon runner: the DMG is arm64-only, matching the bundled rap.
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check tag
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^raptor-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$TAG' is not a Raptor release tag; expected raptor-vX.Y.Z, e.g. raptor-v0.1.2"
            exit 1
          fi
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null; then
            echo "::error::No GitHub release exists for tag $TAG; create the release first (it builds the DMG itself)"
            exit 1
          fi

      # The app is built from the tag, but the release scripts come from
      # this workflow's ref, so a manual run can rebuild an old tag with
      # current tooling. On release events both are the tag's commit.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Xcode Version
        run: xcodebuild -version

      # raptor-dmg.sh signs with the Raptor certificate when a keychain
      # has it, so macOS privacy grants survive updates.
      - name: Import signing certificate
        env:
          RAPTOR_SIGNING_P12: ${{ secrets.RAPTOR_SIGNING_P12 }}
          RAPTOR_SIGNING_P12_PASSWORD: ${{ secrets.RAPTOR_SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$RAPTOR_SIGNING_P12" ] || [ -z "$RAPTOR_SIGNING_P12_PASSWORD" ]; then
            echo "::warning::RAPTOR_SIGNING_P12 or RAPTOR_SIGNING_P12_PASSWORD is not set; the DMG will be ad-hoc signed, so users must re-grant Accessibility after updating"
            exit 0
          fi
          keychain="$RUNNER_TEMP/raptor-signing.keychain-db"
          p12="$RUNNER_TEMP/raptor-signing.p12"
          keychain_password="$(openssl rand -hex 32)"
          echo "::add-mask::$keychain_password"
          printf '%s' "$RAPTOR_SIGNING_P12" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -f pkcs12 \
            -P "$RAPTOR_SIGNING_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          rm -f "$p12"
          echo "RAPTOR_REQUIRE_IDENTITY=1" >> "$GITHUB_ENV"

      - name: Build DMG
        run: |
          set -euo pipefail
          RAPTOR_SRC="$PWD" .release-tools/dist/macos/raptor-dmg.sh "$TAG"
          echo "DMG=Raptor-${TAG#raptor-v}.dmg" >> "$GITHUB_ENV"

      - name: Delete signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/raptor-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/raptor-signing.p12"

      - name: Upload DMG
        run: gh release upload "$TAG" "$DMG" --clobber --repo "$GITHUB_REPOSITORY"

      # The app's updater reads appcast.xml from the fixed raptor-appcast
      # prerelease, which never becomes Latest. Without the signing key the
      # DMG still ships and the existing feed is left untouched. Only the
      # newest raptor-v* tag may move the feed, so it never goes backwards.
      - name: Upload Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_VERSION: 2.9.6
        run: |
          set -euo pipefail
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::warning::SPARKLE_PRIVATE_KEY is not set; skipping appcast.xml, so installed apps will not see $TAG as an update"
            exit 0
          fi
          newest="$(git ls-remote --tags --refs origin 'raptor-v*' | sed 's#.*refs/tags/##' | sort -V | tail -1)"
          if [ "$TAG" != "$newest" ]; then
            echo "::notice::$TAG is not the newest Raptor release ($newest); leaving appcast.xml untouched"
            exit 0
          fi
          if [ ! -f dist/macos/raptor-appcast.sh ]; then
            echo "::notice::$TAG predates the Raptor updater; leaving appcast.xml untouched"
            exit 0
          fi
          mkdir -p .action/sparkle
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-for-Swift-Package-Manager.zip" > .action/sparkle/sparkle.zip
          unzip -q .action/sparkle/sparkle.zip -d .action/sparkle
          PATH="$PWD/.action/sparkle/bin:$PATH" .release-tools/dist/macos/raptor-appcast.sh "$TAG" "$DMG"
          gh release view raptor-appcast --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create raptor-appcast --prerelease --title "Raptor update feed" \
              --notes "Sparkle appcast for Raptor's updater. Do not delete." --repo "$GITHUB_REPOSITORY"
          gh release upload raptor-appcast appcast.xml --clobber --repo "$GITHUB_REPOSITORY"

      - name: Append install notes
        run: |
          marker="<!-- raptor-dmg-notes -->"
          notes="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body)"
          case "$notes" in *"$marker"*) exit 0 ;; esac
          cat > notes.md <<EOF
          $notes

          $marker
          ## Installing $DMG

          Requires an Apple silicon Mac. Open the DMG and drag Raptor to
          Applications. The app is not notarized, so macOS
          blocks the first launch. Either:

          - Open Raptor once, then go to System Settings → Privacy & Security
            and click **Open Anyway**, or
          - run \`xattr -dr com.apple.quarantine /Applications/Raptor.app\`.

          Later versions install through Raptor → Check for Updates.

          Global keybinds (\`keybind = global:...\`) need Accessibility access.
          Coming from an ad-hoc signed Raptor, re-grant it once: in System
          Settings → Privacy & Security → Accessibility, remove Raptor with
          "-", launch the new Raptor and allow it. Afterwards release updates
          and local builds signed with the same certificate share the grant.
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  # Standalone rap for remote machines, installed with
  # `curl -fsSL .../releases/latest/download/install-rap.sh | sh`.
  # Zig cross-compiles every target from one runner; Linux is static musl.
  rap:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # Built from the tag with current tooling, as in the dmg job.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .release-tools

      - name: Setup Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0

      - name: Build rap tarballs
        run: RAPTOR_SRC="$PWD" .release-tools/dist/rap/rap-release.sh "$TAG"

      - name: Upload rap tarballs and installer
        run: |
          set -euo pipefail
          cp .release-tools/dist/rap/install.sh install-rap.sh
          gh release upload "$TAG" rap-*.tar.gz rap-SHA256SUMS install-rap.sh \
            --clobber --repo "$GITHUB_REPOSITORY"
